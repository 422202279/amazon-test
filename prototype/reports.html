<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>报告中心 | CrossBorder Store Review Monitor Lite</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="reports">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">CB</div>
          <div>
            <strong>Review Monitor Lite</strong>
            <p>跨境店铺评论监控</p>
          </div>
        </div>
        <nav class="nav">
          <a class="nav-item" href="./index.html">首页 Dashboard</a>
          <a class="nav-item" href="./stores.html">店铺管理</a>
          <a class="nav-item" href="./products.html">产品总表</a>
          <a class="nav-item" href="./reviews.html">评论总表</a>
          <a class="nav-item" href="./comparison.html">同款多店铺评论对比</a>
          <a class="nav-item" href="./product-detail.html">产品详情</a>
          <a class="nav-item" href="./supplier-tasks.html">供应商整改任务</a>
          <a class="nav-item active" href="./reports.html">报告中心</a>
          <a class="nav-item" href="./settings.html">设置</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>报告中心</h1>
            <p>沉淀产品评论分析、同款多店铺对比和供应商整改建议报告</p>
          </div>
          <div class="topbar-actions">
            <button class="button ghost">导出 Word 占位</button>
            <button class="button primary">新建 Markdown 报告</button>
          </div>
        </header>

        <section class="report-grid" id="report-cards"></section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>历史报告</h2>
              <p>静态页面保留下载入口、来源维度和状态标签</p>
            </div>
            <div class="segmented">
              <button class="active">全部</button>
              <button>产品</button>
              <button>对比</button>
              <button>供应商</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>报告名称</th>
                  <th>类型</th>
                  <th>覆盖范围</th>
                  <th>生成时间</th>
                  <th>状态</th>
                  <th>导出</th>
                </tr>
              </thead>
              <tbody id="reports-table"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
