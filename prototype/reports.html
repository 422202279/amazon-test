<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>报告中心 | CrossBorder Store Review Monitor Lite</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="reports">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">CB</div>
          <div>
            <strong>Review Monitor Lite</strong>
            <p>跨境店铺评论监控</p>
          </div>
        </div>
        <nav class="nav">
          <a class="nav-item" href="./index.html">首页 Dashboard</a>
          <a class="nav-item" href="./stores.html">店铺管理</a>
          <a class="nav-item" href="./products.html">产品总表</a>
          <a class="nav-item" href="./reviews.html">评论总表</a>
          <a class="nav-item" href="./comparison.html">同款多店铺评论对比</a>
          <a class="nav-item" href="./product-detail.html">产品详情</a>
          <a class="nav-item" href="./supplier-tasks.html">供应商整改任务</a>
          <a class="nav-item active" href="./reports.html">报告中心</a>
          <a class="nav-item" href="./settings.html">设置</a>
          <a class="nav-item" href="./account-management.html">账号管理</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1>报告中心</h1>
            <p>按固定模板生成可落地的周报、对比报告和整改汇总，不做花哨空壳</p>
          </div>
          <div class="topbar-actions">
            <button class="button ghost" id="reports-refresh-button">刷新报告列表</button>
            <button class="button primary" id="reports-create-button">新建报告</button>
          </div>
        </header>

        <section class="report-grid" id="report-cards"></section>

        <section class="panel hidden-block" id="report-builder-section">
          <div class="panel-head">
            <div>
              <h2>新建报告</h2>
              <p>点击新建后再展开；一页内选好模板、覆盖站点、周期、模块和导出形式</p>
            </div>
            <div class="panel-actions">
              <button class="button ghost mini-action" id="report-builder-close-button" type="button">收起</button>
              <span class="chip success">模板化报告</span>
            </div>
          </div>
          <div class="form-grid report-builder-grid">
            <label><span>报告标题</span><input id="report-builder-title" type="text" placeholder="例如：7月第1周同款多店铺周报" /></label>
            <label><span>报告类型</span><select id="report-builder-type"><option value="产品评论分析">产品评论分析</option><option value="同款多店铺对比">同款多店铺对比</option><option value="差评原因统计">差评原因统计</option><option value="供应商整改建议">供应商整改建议</option></select></label>
            <label class="full"><span>覆盖站点</span><div class="checkbox-grid" id="report-builder-scopes">
              <label><input type="checkbox" value="US" checked /> 美国</label>
              <label><input type="checkbox" value="UK" checked /> 英国</label>
              <label><input type="checkbox" value="DE" checked /> 德国</label>
              <label><input type="checkbox" value="JP" checked /> 日本</label>
              <label><input type="checkbox" value="CA" checked /> 加拿大</label>
              <label><input type="checkbox" value="FR" checked /> 法国</label>
              <label><input type="checkbox" value="KR" checked /> 韩国</label>
            </div></label>
            <label><span>统计周期</span><select id="report-builder-period"><option value="30d">近30天</option><option value="60d">近60天</option><option value="90d">近90天</option><option value="180d">近半年</option><option value="365d">近一年</option></select></label>
            <label><span>补充说明</span><input id="report-builder-scope" type="text" placeholder="例如：只看宠物喂食器 / 重点关注北美差评" /></label>
            <label class="full"><span>勾选模块</span><div class="checkbox-grid" id="report-builder-modules">
              <label><input type="checkbox" value="summary" checked /> 摘要结论</label>
              <label><input type="checkbox" value="product_table" checked /> 产品表格</label>
              <label><input type="checkbox" value="review_table" checked /> 评论表格</label>
              <label><input type="checkbox" value="comparison_table" checked /> 多店铺对比表</label>
              <label><input type="checkbox" value="issue_chart" checked /> 问题分类统计</label>
              <label><input type="checkbox" value="supplier_tasks" checked /> 整改任务跟进</label>
            </div></label>
            <label class="full"><span>导出格式</span><div class="checkbox-grid" id="report-builder-formats">
              <label><input type="checkbox" value="markdown" checked /> Markdown</label>
              <label><input type="checkbox" value="table" checked /> 表格明细</label>
              <label><input type="checkbox" value="excel" /> Excel 导出</label>
            </div></label>
          </div>
          <div class="topbar-actions section-actions">
            <button class="button ghost" id="report-builder-preview-button" type="button">预览报告结构</button>
            <button class="button primary" id="report-builder-create-button" type="button">生成报告</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>模块</th>
                  <th>内容预览</th>
                  <th>输出形式</th>
                </tr>
              </thead>
              <tbody id="report-builder-preview"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>历史报告</h2>
              <p>生成后可查看 Markdown 正文，也可导出对应表格明细</p>
            </div>
            <div class="segmented">
              <button class="active" data-report-filter="all">全部</button>
              <button data-report-filter="产品评论分析">产品</button>
              <button data-report-filter="同款多店铺对比">对比</button>
              <button data-report-filter="供应商整改建议">供应商</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>报告名称</th>
                  <th>类型</th>
                  <th>覆盖范围</th>
                  <th>生成时间</th>
                  <th>状态</th>
                  <th>导出</th>
                </tr>
              </thead>
              <tbody id="reports-table"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
